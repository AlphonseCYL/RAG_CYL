version: '3.8'
services:
  swxy_api:
    build:
      context: ./app  # context 是 Dockerfile 所在的路径，默认是 docker-compose.yml 文件所在的目录
      dockerfile: Dockerfile  # dockerfile（可选）指定了要使用的 Dockerfile 文件名。如果不指定，...
      # Docker Compose 默认会查找名为 Dockerfile 的文件
      # image 指定了构建后镜像的名称和标签。如果不指定 image，...
      # Docker Compose 会为构建的镜像生成一个默认名称，通常是 <projectname>_<servicename>
    hostname: swxy_api
    container_name: swxy_api
    # 默认情况下，如果没有为启动的容器指定名称，Docker Compose 会自动为每个容器生成一个唯一的名称，
    # 格式通常是 <projectname>_<servicename>_<num>
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - DATABASE_URL=postgresql://postgres:pg123456@gsk_pg:5432/gsk
      - ES_HOST=http://es01:9200
      - ROOT_PATH=http://localhost:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    ports:
      - "8000:8000"  # 只保留应用服务的端口映射。将容器的端口80映射到宿主机的端口8080
      # ports:- "8080:80"- "127.0.0.1:8080:80"
    volumes:
      - ./app:/app/app    # 将本地的 app 目录挂载到容器内的 /app/app 目录
      - /C/Users/ALPHONSE/AppData/Roaming/nltk_data:/usr/local/nltk_data
      # 在 Windows 11 上，挂载路径需要以 / 开头
    command: ["uvicorn", "app_main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    depends_on:
      - gsk_pg
      - es01
      - redis
    networks:
      - gsk_network

  es01:
    container_name: gsk-es-01
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    volumes:
      - gsk_esdata01:/usr/share/elasticsearch/data
    env_file: .env
    environment:
      - node.name=es01
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - cluster.routing.allocation.disk.watermark.low=5gb
      - cluster.routing.allocation.disk.watermark.high=3gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
      - TZ=${TIMEZONE}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    mem_limit: ${MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:9200"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: on-failure
    networks:
      - gsk_network

  gsk_pg:
    container_name: gsk_pg
    image: postgres:15-alpine
    environment:
      - POSTGRES_PASSWORD=pg123456
      - POSTGRES_USER=postgres
      - POSTGRES_DB=gsk
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - gsk_network

  redis:
    container_name: gsk_redis
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - gsk_network

volumes:
  gsk_esdata01:
    driver: local
  pg_data:
    driver: local
  redis_data:
    driver: local

networks:
  gsk_network:
    driver: bridge
