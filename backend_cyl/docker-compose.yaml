services:
  redis:
    container_name: backend_cyl_redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    networks:
      - backend_rag_network
  
  es:
    container_name: es_01
    image: elasticsearch:9.4.1
    volumes:
      - es_knowledge_data_01:/usr/share/elasticsearch/data
      - es_plugins:/usr/share/elasticsearch/plugins
      - ./docker_conf/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    ports:
      - "9200:9200"
    env_file: .env
    environment:
      - ELASTIC_PASSWORD=${ES_PASSWORD}
      - bootstrap.memory_lock=false
      - TZ=${TIMEZONE}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:9200"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: on-failure
    networks:
      - backend_rag_network
  
  kibana:
    container_name: kibana_cyl
    image: kibana:9.4.1
    volumes:
      - kibana_data:/usr/share/kibana/data
      - ./docker_conf/kibana.yml:/usr/share/kibana/config/kibana.yml
    ports:
      - "5601:5601"
    restart: on-failure
    networks:
      - backend_rag_network

volumes:
  redis_data:
    driver: local
  es_knowledge_data_01:
    driver: local
  es_plugins:
    driver: local
  kibana_data:
    driver: local
  

networks:
  backend_rag_network:
    driver: bridge
